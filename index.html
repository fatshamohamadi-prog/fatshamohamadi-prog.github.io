<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fatemeh Shahmohammadi – Resume</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Inter:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1d2430;--mut:#5f6b7a;--acc:#1f3a5f;--gold:#c9a227;--soft:#eef2f7;--line:#e2e7ee;--hero:#1f3a5f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1521;--card:#162030;--ink:#e8edf5;--mut:#9aa8bb;--acc:#9bb9e6;--soft:#1d2a3d;--line:#263447;--hero:#18304f}}
:root[data-theme="dark"]{--bg:#0e1521;--card:#162030;--ink:#e8edf5;--mut:#9aa8bb;--acc:#9bb9e6;--soft:#1d2a3d;--line:#263447;--hero:#18304f}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Vazirmatn",system-ui,sans-serif;line-height:1.7}
body.fa{font-family:"Vazirmatn","Inter",system-ui,sans-serif}
.hero{background:linear-gradient(135deg,var(--hero),#2c5282);color:#fff;border-bottom:5px solid var(--gold);padding:calc(32px + env(safe-area-inset-top,0px)) 20px 36px}
.hero-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.photo{width:148px;height:148px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.hero h1{margin:0;font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.2}
.role{margin:6px 0 16px;color:#ecd98f;font-size:clamp(16px,2.6vw,22px)}
.langs{display:inline-flex;gap:6px;background:rgba(255,255,255,.12);padding:4px;border-radius:999px}
.langs button{border:0;background:transparent;color:#fff;font:inherit;font-size:14px;padding:6px 16px;border-radius:999px;cursor:pointer}
.langs button.on{background:var(--gold);color:#1a1a1a;font-weight:600}
main{max-width:960px;margin:0 auto;padding:24px 16px calc(40px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 300px;gap:20px}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:0 2px 10px rgba(20,30,50,.05)}
.card h2{margin:0 0 12px;font-size:17px;color:var(--acc);letter-spacing:.04em;padding-bottom:8px;border-bottom:2px solid var(--gold);display:inline-block}
.card p{margin:0}
.job{padding:12px 0;border-top:1px dashed var(--line)}
.job:first-of-type{border-top:0;padding-top:2px}
.job h3{margin:0;font-size:16px}
.date{display:inline-block;margin:2px 0 6px;color:var(--gold);font-weight:600;font-size:13px}
.sub{color:var(--mut);font-size:15px}
ul{margin:6px 0 0;padding-inline-start:20px}
li{margin:3px 0}
li::marker{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.mut{color:var(--mut);font-size:14px}
.contact a{display:flex;gap:10px;align-items:center;color:var(--ink);text-decoration:none;padding:8px 10px;border-radius:10px;word-break:break-all;font-size:14.5px}
.contact a:hover{background:var(--soft)}
.contact b{color:var(--acc);min-width:64px;font-size:13px}
.ltr{direction:ltr;unicode-bidi:isolate}
footer{text-align:center;color:var(--mut);font-size:13px;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
@media (max-width:760px){main{grid-template-columns:1fr}.hero-in{justify-content:center;text-align:center}.photo{width:128px;height:128px}}
</style>
</head>
